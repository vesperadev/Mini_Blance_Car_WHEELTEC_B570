# OpenOCD 调试配置 —— WHEELTEC B570 平衡小车 (STM32F103C8T6)
# 调试器: Horco CMSIS-DAP v2 无线调试器 (VID:PID = 0xfaed:0x4873)

source [find interface/cmsis-dap.cfg]
transport select swd

# 无线探针以 CMSIS-DAPv2 (WinUSB) 方式枚举, 无需额外设置;
# 若同时接入多个探针, 取消下一行注释以绑定序列号
# cmsis_dap_serial fec64a34

adapter speed 1000

source [find target/stm32f1x.cfg]

# 无线调试器只连接 SWDIO/SWCLK/GND, 没有 nRST,
# 因此禁用硬件复位, 复位时使用 SYSRESETREQ 软复位
reset_config none
